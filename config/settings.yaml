scraping:
  request_timeout: 30
  delay_between_requests: 2  # seconds between article fetches to avoid rate limiting
  # Temporarily raised 20 -> 50 to catch up the ET sources: their feeds hold 50
  # items but only the newest 20 were ever taken, so items 21-50 aged out unread
  # (~150 articles back to 2026-07-10). 50 is the feed depth — higher gains
  # nothing on RSS sources and only makes the listing scrapers walk more pages.
  # Revert to 20 after one full scrape cycle; steady-state ticks every 10m need
  # nowhere near 50, and the smaller cap keeps the per-tick article fetches down.
  max_articles_per_source: 50
  batch_size: 10  # articles per DB write once all sources finish scraping

# LLM used for deal extraction and company signals. Now Gemini, called through
# the google-genai SDK — the block keeps the `groq` name because the CLI flag
# (--groq-api-key) and the exported config blob still use it; the key it
# carries is a Gemini key.
#
# base_url is unset: the SDK knows Google's endpoint. Set it only to point at a
# proxy. The old `.../v1beta/openai` value belonged to the compatibility
# endpoint and is ignored if an older exported config still carries it.
groq:
  model: gemini-3.5-flash-lite
  temperature: 0.1

# Company deal-propensity signals (POST /companies/{id}/signals/generate).
# Turned off for now — generating a snapshot is an LLM call per company, and we
# aren't using the scores yet. Reading previously stored snapshots via
# /signals/latest keeps working either way. Set to true to re-enable.
signals:
  enabled: false

database:
  uri: neo4j://127.0.0.1:7687
  username: neo4j
  database: newsscrapedatabase
  pool_size: 5

# Company MySQL (read-only). Host/user/password/database come from MYSQL_* env
# vars; these are tuning defaults only. Omit the env vars to run without it.
company_mysql:
  port: 3306
  pool_size: 5
  connect_timeout: 10   # seconds to establish a connection
  read_timeout: 30      # seconds to wait for a query result
  charset: utf8mb4

# Restricts news runs to companies tracked in the company MySQL DB.
watchlist:
  default_since_hours: 24     # "newly added" window when `since` is omitted; 0 disables the cutoff
  max_entities_per_run: 200   # cap on on-site searches per run
  min_term_length: 3          # drop search terms shorter than this
  gate_listing_sources: true  # keep only entity-mentioning articles from sources without search_url

scheduler:
  scrape_interval_minutes: 10
  extraction_interval_minutes: 10
  extraction_batch_limit: 50  # max pending articles pulled per extraction tick
