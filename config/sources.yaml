  - name: Financial Express Market
    url: https://www.financialexpress.com/market/
    # No RSS: /market/feed/ and /feed/ both return non-feed responses.
    domain: financialexpress.com
    link_contains: /market/
    scraper: fe
    paginate: true
    max_pages: 30

