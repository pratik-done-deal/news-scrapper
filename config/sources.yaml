  - name: CNBC Deals and IPOs
    url: https://www.cnbc.com/deals-and-ipos/
    # Deals-and-IPOs feed. Teaser-only (~100 chars), so articles are still
    # fetched — the win here is the listing walk and the reliable pubDate.
    rss_url: https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=10000664
    domain: cnbc.com
    link_contains: /20
    scraper: cnbc
    paginate: true
    max_pages: 20

