# `rss_url` makes a source read its publisher's feed on routine (no date range,
# no company) runs: one request instead of a listing walk plus a fetch per
# article, with publisher-supplied dates. Feeds hold only 1-7 days and cannot be
# searched, so date-range backfill and company scrapes still use the scraper below.
# Optional per-source keys: `rss_link_contains` (path filter, off by default —
# feed paths often differ from the section listing's) and `rss_max_age_hours`
# (staleness warning threshold, default 48).

sources:
  - name: Economic Times Corporate
    url: https://economictimes.indiatimes.com/news/company/corporate-trends
    # Company-News feed, listed in ET's own index at /rss.cms. 50 items covering
    # ~2 weeks, every link under /news/company/ — so the default
    # `rss_link_contains` behaviour needs no override.
    rss_url: https://economictimes.indiatimes.com/news/company/rssfeeds/2143429.cms
    domain: economictimes.indiatimes.com
    link_contains: /news/company/
    scraper: et
    paginate: true      # enables multi-page date-range scraping when --start-date/--end-date are passed
    max_pages: 20       # how many listing pages to walk through

  - name: Economic Times Startups
    url: https://economictimes.indiatimes.com/tech/startups
    # Startups-Tech feed: 50 items, ~2 weeks, all under /tech/startups/.
    rss_url: https://economictimes.indiatimes.com/tech/startups/rssfeeds/78570540.cms
    domain: economictimes.indiatimes.com
    link_contains: /tech/startups/
    scraper: et
    paginate: false


  - name: Economic Times Tech and Internet
    url: https://economictimes.indiatimes.com/tech/technology
    # Tech & Internet-Tech feed: 50 items, all under /tech/technology/.
    # Highest-volume of the four — 50 items spans only ~3 days, so this one
    # depends on the routine schedule running at least every couple of days.
    rss_url: https://economictimes.indiatimes.com/tech/technology/rssfeeds/78570561.cms
    domain: economictimes.indiatimes.com
    link_contains: /tech/technology/
    scraper: et
    paginate: false

  - name: Economic Times Funding
    url: https://economictimes.indiatimes.com/tech/funding
    # Funding-Tech feed: 50 items, ~27 days, all under /tech/funding/.
    rss_url: https://economictimes.indiatimes.com/tech/funding/rssfeeds/78570550.cms
    domain: economictimes.indiatimes.com
    link_contains: /tech/funding/
    scraper: et
    paginate: false

  - name: Economic Times Telecom
    url: https://economictimes.indiatimes.com/industry/telecom
    # Telecom-Industry feed: 50 items, ~31 days, all under /industry/telecom/.
    rss_url: https://economictimes.indiatimes.com/industry/telecom/rssfeeds/13354103.cms
    domain: economictimes.indiatimes.com
    link_contains: /industry/telecom/
    scraper: et
    paginate: false

  - name: India Infoline M&A
    url: https://www.indiainfoline.com/news/mergers-acquisitions
    # No RSS: no feed found at any of the usual paths.
    domain: indiainfoline.com
    link_contains: /news/
    scraper: iifl
    paginate: true
    max_pages: 20

  - name: Indian Startup News Funding
    url: https://indianstartupnews.com/funding
    # Company-scrape search endpoint; {query} is filled with the URL-encoded company name.
    search_url: https://indianstartupnews.com/search?title={query}
    # Feed carries the full article body and covers all of ISN's news, not just
    # /funding/ — broader than the listing above, and NewsFilter sorts relevance out.
    rss_url: https://indianstartupnews.com/rss
    domain: indianstartupnews.com
    link_contains: /funding/
    scraper: isn
    paginate: true
    max_pages: 20

  - name: Inc42 Homepage
    url: https://inc42.com/
    # Company-scrape search API. Unlike the other search_url entries this is not a
    # {query} template — Inc42's search is a POST endpoint taking a `query` field.
    search_url: https://search.thed2csummit.co/query
    # Feed ships content:encoded, which yields ~3x more text than scraping the
    # article page does (trafilatura recovers only ~740 chars through Inc42's wall).
    # Only ~24 items ≈ 1.1 days of history, so it depends on the regular schedule.
    rss_url: https://inc42.com/feed/
    domain: inc42.com
    link_contains: /
    scraper: inc42
    paginate: false

  - name: Entrackr News
    url: https://entrackr.com/news
    search_url: https://entrackr.com/search?title={query}
    # Feed body matches the fetched article almost exactly (~100% of its length).
    rss_url: https://entrackr.com/rss
    domain: entrackr.com
    link_contains: /news/
    scraper: entrackr
    paginate: true
    max_pages: 20

